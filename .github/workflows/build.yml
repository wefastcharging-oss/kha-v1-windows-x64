name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
      - name: Fetch ticket generator binary
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://github.com/denuvosanctuary/steam-ticket-generator/releases/download/v1.2.1/steam-ticket-generator-windows.zip' -OutFile engine\stg.zip
          Expand-Archive engine\stg.zip -DestinationPath engine\ticket-generator -Force
          Get-ChildItem engine\ticket-generator -Filter *.exe | Where-Object Name -ne 'steam-ticket-generator.exe' | Rename-Item -NewName steam-ticket-generator.exe
          Invoke-WebRequest -Uri 'https://github.com/SteamRE/DepotDownloader/releases/download/DepotDownloader_3.4.0/DepotDownloader-windows-x64.zip' -OutFile engine\dd.zip
          Expand-Archive engine\dd.zip -DestinationPath engine\tools\depotdownloader -Force
          Invoke-WebRequest -Uri 'https://github.com/atom0s/Steamless/releases/download/v3.1.0.5/Steamless.v3.1.0.5.-.by.atom0s.zip' -OutFile engine\sl.zip
          Expand-Archive engine\sl.zip -DestinationPath engine\tools\steamless -Force
          Remove-Item engine\stg.zip,engine\dd.zip,engine\sl.zip -ErrorAction SilentlyContinue

      - name: Compile ticket wrapper
        run: |
          New-Item -ItemType Directory -Force engine\ticket-generator | Out-Null
          & "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /optimize /target:exe /out:engine\ticket-generator\TicketTerminal.exe engine\TicketTerminal.cs
        shell: pwsh

      - name: Build portable EXE
        run: npm run build:win

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: kha-windows-portable
          path: dist/*.exe

      - name: Publish latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kha-latest
          name: KHA Windows Portable
          body: Latest automatic Windows build.
          files: dist/*.exe

